<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotating donut</title>
  <style>
    :root { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      overflow-x: hidden;
    }

    .donut-box {
      box-sizing: border-box;
      max-width: 100vw;
      padding: 1.5rem 1.75rem;
      border: 1px solid #2f3648;
      border-radius: 12px;
      background: #161a24;
      box-shadow: 0 12px 40px rgb(0 0 0 / 0.45);
    }

    .donut-box pre {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      /* 80 columns at a 0.6em advance need 48em, so the size tracks the
         viewport to keep the box inside even a 320px screen. */
      font-size: clamp(3.5px, 1.55vw, 13px);
      line-height: 1.2;
      color: #ffcf8f;
      white-space: pre;
    }

    @media (max-width: 600px) {
      .donut-box {
        padding: 0.75rem;
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="donut-box">
    <pre id="donut" role="img" aria-label="Spinning ASCII art donut"></pre>
  </div>

  <script src="donut-renderer.js"></script>
  <script>
    const output = document.getElementById("donut");
    const stillMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const SPIN_A = 0.04;
    const SPIN_B = 0.02;
    const STILL_POSE = [1, 1];

    let angleA = 0;
    let angleB = 0;
    let frameHandle = null;

    function draw(a, b) {
      output.textContent = DonutRenderer.renderDonutFrame(a, b).text;
    }

    function spin() {
      draw(angleA, angleB);
      angleA += SPIN_A;
      angleB += SPIN_B;
      frameHandle = requestAnimationFrame(spin);
    }

    function applyMotionPreference() {
      if (stillMotion.matches) {
        if (frameHandle !== null) {
          cancelAnimationFrame(frameHandle);
          frameHandle = null;
        }
        draw(...STILL_POSE);
      } else if (frameHandle === null) {
        spin();
      }
    }

    stillMotion.addEventListener("change", applyMotionPreference);
    applyMotionPreference();
  </script>
</body>
</html>
